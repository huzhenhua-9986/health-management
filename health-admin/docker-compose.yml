version: '3.8'

services:
  # 管理后台前端
  admin-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-admin-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://admin-backend:3002/api
    restart: unless-stopped
    networks:
      - health-network
    depends_on:
      - admin-backend

  # 后端API服务
  admin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: health-admin-backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
    networks:
      - health-network

networks:
  health-network:
    driver: bridge
